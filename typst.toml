[package]
name = "drawio"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["drawio-typst contributors"]
license = "MIT AND Apache-2.0"
description = "Render draw.io / diagrams.net files in Typst with draw.io's own renderer, as native Typst shapes and text."
keywords = ["drawio", "diagrams.net", "diagram", "flowchart"]
categories = ["visualization"]
exclude = ["example/*.png", "example/*.pdf", "example/inflate-test.*", "plugin", "HANDOFF.md"]
