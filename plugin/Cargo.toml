[package]
name = "drawio-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rquickjs = { version = "0.14", features = ["allocator"] }
wasm-minimal-protocol = "0.2"
miniz_oxide = "0.9"
ruzstd = "0.9"
rustybuzz = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
